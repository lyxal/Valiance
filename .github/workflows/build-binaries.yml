name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            output: valiance
            asset: valiance-linux
          - os: macos-latest
            output: valiance
            asset: valiance-macos
          - os: windows-latest
            output: valiance.exe
            asset: valiance-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Cache Nuitka build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/AppData/Local/Nuitka/Nuitka/Cache
            ~/Library/Caches/Nuitka
          key: nuitka-${{ matrix.os }}-${{ hashFiles('uv.lock', 'src/**/*.py') }}
          restore-keys: |
            nuitka-${{ matrix.os }}-

      - name: Build with Nuitka
        run: >
          uv run --with nuitka python -m nuitka
          --onefile
          --standalone
          --include-package=valiance
          --include-package=valiance.std
          --include-package=prompt_toolkit
          --include-data-dir=src/valiance/std=valiance/std
          --noinclude-data-files=*.py
          --output-filename=${{ matrix.output }}
          --output-dir=dist
          src/valiance/main.py

      - name: Smoke test stdlib discovery
        shell: bash
        run: |
          ./dist/${{ matrix.output }} docs --language --format json -o /tmp/lang-ref.json
          test -s /tmp/lang-ref.json

      - name: Rename artifact
        shell: bash
        run: cp dist/${{ matrix.output }} dist/${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files:  artifacts/**/*
