name: Build Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os_tag: linux
            ext: ""
          - os: macos-latest
            os_tag: macos
            ext: ""
          - os: windows-latest
            os_tag: windows
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Temporarily relax requires-python for Nuitka compatibility
        shell: bash
        run: |
          sed -i.bak 's/requires-python = ">=3.14"/requires-python = ">=3.13"/' pyproject.toml

      - name: Install dependencies
        run: uv sync

      - name: Cache Nuitka build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/AppData/Local/Nuitka/Nuitka/Cache
            ~/Library/Caches/Nuitka
          key: nuitka-${{ matrix.os }}-${{ hashFiles('uv.lock', 'src/**/*.py') }}
          restore-keys: |
            nuitka-${{ matrix.os }}-

      - name: Build src/valiance/main.py with Nuitka
        run: >
          uv run --with nuitka python -m nuitka
          --onefile
          --standalone
          --assume-yes-for-downloads
          --include-package=valiance
          --include-package=valiance.std
          --include-package=prompt_toolkit
          --include-data-dir=src/valiance/std=valiance/std
          --noinclude-data-files=*.py
          --output-filename=valiance${{ matrix.ext }}
          --output-dir=dist
          src/valiance/main.py

      - name: Name the platform release binary
        shell: bash
        run: |
          cp dist/valiance${{ matrix.ext }} dist/valiance-${{ matrix.os_tag }}${{ matrix.ext }}

      - name: Smoke test both installed command names
        shell: bash
        run: |
          cp dist/valiance${{ matrix.ext }} dist/vln${{ matrix.ext }}
          ./dist/valiance${{ matrix.ext }} --help > valiance-help.txt || test $? -eq 2
          ./dist/vln${{ matrix.ext }} --help > vln-help.txt || test $? -eq 2
          grep -q '^usage: valiance' valiance-help.txt
          grep -q '^usage: vln' vln-help.txt
          ./dist/valiance${{ matrix.ext }} docs --language --format json -o /tmp/lang-ref.json
          test -s /tmp/lang-ref.json
          rm dist/vln${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: valiance-${{ matrix.os_tag }}${{ matrix.ext }}
          path: dist/valiance-${{ matrix.os_tag }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            install.sh
            install.ps1
