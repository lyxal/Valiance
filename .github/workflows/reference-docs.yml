name: Generate language reference

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reference-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reference-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv python install 3.14
      - name: Install project
        # Re-resolve the lockfile when pyproject.toml has changed. Frozen sync
        # silently omitted regex when it was missing from the committed lock.
        run: uv sync
      - name: Verify regex runtime dependency
        run: uv run --frozen python -c "import regex; import valiance.std.regex"
      - name: Validate documentation
        run: uv run --frozen python -m unittest tests.test_reference_docs
      - name: Generate built-in and standard library documentation
        run: uv run --frozen python scripts/generate_reference_docs.py --output docs/reference
      - name: Upload reference for this commit
        uses: actions/upload-artifact@v4
        with:
          name: language-reference-${{ github.sha }}
          path: docs/reference/
          if-no-files-found: error
          retention-days: 30
      - name: Commit generated reference
        if: github.event_name != 'pull_request' && github.ref_type == 'branch'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git add docs/reference/
          if git diff --cached --quiet; then
            echo "Reference documentation is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update generated language reference"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
