name: Sort builtins and documentation

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: sort-builtins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sort-builtins:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Sort builtins and documentation
        run: python scripts/sort_builtins.py

      - name: Verify pull requests without pushing
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code -- src/valiance/elements/builtins.py || {
            echo "Builtins or documentation are not sorted. Run: python scripts/sort_builtins.py"
            exit 1
          }

      - name: Commit sorted builtins on branch pushes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- src/valiance/elements/builtins.py; then
            echo "Builtins and documentation already sorted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/valiance/elements/builtins.py
          git commit -m "chore: sort builtins and documentation alphabetically"
          git push
