name: std.http regression and manual release qualification (Python 3.14)

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/valiance/std/*http*'
      - 'src/valiance/std/file*'
      - 'src/valiance/std/_filesystem_core.py'
      - 'src/valiance/runtime/**'
      - 'tests/test_std_http*'
      - 'tests/test_http_qualification.py'
      - 'tests/test_std_file_integration.py'
      - 'tests/test_concurrency_*.py'
      - 'tests/test_programs.py'
      - 'tools/qualify_std_http.py'
      - 'tools/profile_std_http_resources.py'
      - 'tools/check_std_http_native.py'
      - 'tools/build_std_http_libcurl.py'
      - 'tools/qualify_std_http_instrumented.py'
      - 'tools/check_std_http_stable.py'
      - 'tools/verify_std_http_release_archive.py'
      - 'tests/test_std_http_stable_gate.py'
      - 'tests/test_std_http_archive.py'
      - 'tests/test_std_http_instrumented_policy.py'
      - 'tests/test_std_http_dependency_policy.py'
      - 'tools/fuzz_std_http_protocol.py'
      - 'tools/soak_std_http.py'
      - 'tools/fuzz_std_http_http2.py'
      - 'tools/soak_std_http_http2.py'
      - 'tools/validate_std_http_native.py'
      - 'tools/native_std_http_probe.c'
      - 'tools/check_std_http_release.py'
      - 'tools/audit_std_http_packaging.py'
      - 'tools/coverage_std_http.py'
      - 'tools/merge_std_http_qualification.py'
      - '.github/workflows/std-http-qualification.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - 'src/valiance/std/*http*'
      - 'src/valiance/std/file*'
      - 'src/valiance/std/_filesystem_core.py'
      - 'src/valiance/runtime/**'
      - 'tests/test_std_http*'
      - 'tests/test_http_qualification.py'
      - 'tests/test_std_file_integration.py'
      - 'tests/test_concurrency_*.py'
      - 'tests/test_programs.py'
      - 'tools/qualify_std_http.py'
      - 'tools/profile_std_http_resources.py'
      - 'tools/check_std_http_native.py'
      - 'tools/build_std_http_libcurl.py'
      - 'tools/qualify_std_http_instrumented.py'
      - 'tools/check_std_http_stable.py'
      - 'tools/verify_std_http_release_archive.py'
      - 'tests/test_std_http_stable_gate.py'
      - 'tests/test_std_http_archive.py'
      - 'tests/test_std_http_instrumented_policy.py'
      - 'tests/test_std_http_dependency_policy.py'
      - 'tools/fuzz_std_http_protocol.py'
      - 'tools/soak_std_http.py'
      - 'tools/fuzz_std_http_http2.py'
      - 'tools/soak_std_http_http2.py'
      - 'tools/validate_std_http_native.py'
      - 'tools/native_std_http_probe.c'
      - 'tools/check_std_http_release.py'
      - 'tools/audit_std_http_packaging.py'
      - 'tools/coverage_std_http.py'
      - 'tools/merge_std_http_qualification.py'
      - '.github/workflows/std-http-qualification.yml'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  qualification:
    # Fast, cross-platform regression checking only. Hosted images can ship
    # libcurl older than our production minimum. The override is limited to
    # THIS test job and MUST NOT be used for native/release qualification.
    # All production paths still enforce the secure native dependency floor.
    env:
      VALIANCE_HTTP_INSECURE_ALLOW_OLD_LIBCURL: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.14 and dependencies
        run: |
          uv python install 3.14
          uv sync --python 3.14 --locked
      - name: Portable API, dependency-policy and documentation regressions
        shell: bash
        run: |
          uv run --python 3.14 --frozen --with "cryptography>=44" python tools/qualify_std_http.py \
            --suite tests.test_std_http_dependency_policy \
            --suite tests.test_std_http_reference_examples \
            --suite tests.test_std_http_ci_workflows \
            --timeout-seconds 180 --report std-http-portable-regression.json
      - name: Linux native-transport integration regressions (development only)
        # Windows/macOS native transport qualification requires a verified
        # packaged libcurl; never pretend host image libraries satisfy that.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uv run --python 3.14 --frozen --with "cryptography>=44" python tools/qualify_std_http.py \
            --suite tests.test_std_http \
            --suite tests.test_std_http_http2 \
            --suite tests.test_std_http_security_audit \
            --timeout-seconds 180 --report std-http-linux-transport-regression.json
      - name: Upload non-release regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: std-http-regression-${{ matrix.os }}
          path: |
            std-http-portable-regression.json
            std-http-linux-transport-regression.json
          if-no-files-found: error

  linux-native-and-security-validation:
    # Native source builds, fuzzing, and 90-second soaks are manually
    # dispatched release-validation work, never run on every push or PR.
    if: github.event_name == 'workflow_dispatch'
    # This separate, evidence-gated Linux campaign does not replace the
    # platform matrix above or an externally instrumented libcurl/TLS build.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install qualification dependencies
        run: |
          uv python install 3.14
          uv sync --python 3.14 --locked
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libnghttp2-dev libssl-dev pkg-config cmake gcc
      - name: Build checksum-pinned libcurl 8.23.0 for qualification
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_std_http_libcurl.py \
            --prefix "$RUNNER_TEMP/valiance-curl-8.23" \
            --report std-http-evidence/curl-build.json
          # Use the inspected source-build output rather than assuming
          # a platform-specific install library directory.
          CURL_LIB="$(python -c 'import json; print(json.load(open("std-http-evidence/curl-build.json"))["library"])')"
          test -n "$CURL_LIB" && test -f "$CURL_LIB"
          echo "VALIANCE_LIBCURL_PATH=$CURL_LIB" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$CURL_LIB"):${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "VALIANCE_LIBCURL_LICENSE=$RUNNER_TEMP/valiance-curl-8.23/licenses/libcurl-COPYING.txt" >> "$GITHUB_ENV"
      - name: Run independently bounded regression suites
        shell: bash
        run: |
          mkdir -p std-http-evidence
          uv run --python 3.14 --frozen --with "cryptography>=44" python tools/qualify_std_http.py \
            --timeout-seconds 360 --report std-http-evidence/qualification.json
      - name: Run native libcurl C multi ASan/UBSan probe
        shell: bash
        run: |
          uv run --python 3.14 --frozen python tools/validate_std_http_native.py \
            --rounds 80 --report std-http-evidence/native-asan.json
      - name: Run independent HTTP/1.1 and HTTP/2 wire mutation corpora
        shell: bash
        run: |
          uv run --python 3.14 --frozen python tools/fuzz_std_http_protocol.py \
            --seed 20261120 --count 1800 --report std-http-evidence/http1-fuzz.json
          uv run --python 3.14 --frozen --with "cryptography>=44" python tools/fuzz_std_http_http2.py \
            --seed 20261120 --count 240 --report std-http-evidence/http2-fuzz.json
      - name: Run repeated client recovery, load and dependency checks
        shell: bash
        run: |
          uv run --python 3.14 --frozen --with "psutil>=5.9" python tools/profile_std_http_resources.py \
            --clients-per-batch 45 --batches 3 --report std-http-evidence/resource-profile.json
          uv run --python 3.14 --frozen --with "psutil>=5.9" python tools/soak_std_http.py \
            --duration-seconds 90 --concurrency 64 --report std-http-evidence/long-soak.json
          uv run --python 3.14 --frozen --with "cryptography>=44" python tools/soak_std_http_http2.py \
            --requests 3000 --concurrency 48 --report std-http-evidence/http2-soak.json
          uv run --python 3.14 --frozen python tools/check_std_http_native.py \
            --report std-http-evidence/native-dependency.json
          uv run --python 3.14 --frozen python tools/audit_std_http_packaging.py \
            --bundled-library "$VALIANCE_LIBCURL_PATH" \
            --license-file "$VALIANCE_LIBCURL_LICENSE" \
            --report std-http-evidence/packaging.json
      - name: Measure Python HTTP statement and branch coverage
        shell: bash
        run: |
          uv run --python 3.14 --frozen --with "coverage>=7" --with "cryptography>=44" python tools/coverage_std_http.py \
            --report std-http-evidence/python-coverage.json
      - name: Fail closed on incomplete or missing evidence
        shell: bash
        run: |
          uv run --python 3.14 --frozen python tools/check_std_http_release.py \
            --evidence-dir std-http-evidence --report std-http-evidence/local-release-gate.json
      - name: Upload evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: std-http-native-security-linux
          path: std-http-evidence/
          if-no-files-found: warn

  linux-instrumented-libcurl-bindings:
    # Instrumented source builds are manually triggered, not commit checks.
    if: github.event_name == 'workflow_dispatch'
    # Separate security experiment: libcurl itself is ASan/UBSan-instrumented.
    # This still does NOT prove the TLS/nghttp2 dependency stack has been
    # instrumented. That requires separately instrumented native libraries.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies and build ASan/UBSan libcurl 8.23.0
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc cmake libnghttp2-dev libssl-dev pkg-config libcurl4-openssl-dev
          uv python install 3.14
          uv sync --python 3.14 --locked
          mkdir -p instrumented-evidence
          python tools/build_std_http_libcurl.py \
            --prefix "$RUNNER_TEMP/valiance-curl-sanitized" --sanitizers \
            --report instrumented-evidence/source-build.json
      - name: Run bound native-binding and hostile-network tests with instrumented curl
        shell: bash
        run: |
          set -euo pipefail
          CURL_LIB="$RUNNER_TEMP/valiance-curl-sanitized/lib/libcurl.so"
          test -f "$CURL_LIB"
          uv run --python 3.14 --frozen --with "cryptography>=44" \
            python tools/qualify_std_http_instrumented.py \
            --library "$CURL_LIB" --timeout-seconds 300 \
            --report instrumented-evidence/native-binding.json
      - name: Preserve instrumentation evidence, including failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: std-http-instrumented-libcurl-${{ github.run_id }}
          path: instrumented-evidence/
          if-no-files-found: warn
