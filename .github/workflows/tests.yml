name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Install project dependencies
        # Keep the environment synchronized with pyproject.toml even when a
        # dependency was added without regenerating uv.lock. In particular,
        # std.regex requires the third-party regex package.
        run: uv sync
      - name: Verify regex runtime dependency
        run: uv run --frozen python -c "import regex; import valiance.std.regex"
      - name: Run test suite
        timeout-minutes: 15
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Run isolated trait P0 oracles
        timeout-minutes: 15
        if: always() && github.event_name != 'schedule'
        run: uv run --frozen python -m tools.trait_plan --priority P0 --report trait-plan-results.json
      - name: Run complete isolated trait plan
        timeout-minutes: 30
        if: always() && github.event_name == 'schedule'
        run: uv run --frozen python -m tools.trait_plan --report trait-plan-results.json
      - name: Run isolated generics smoke oracles
        timeout-minutes: 15
        if: always() && github.event_name != 'schedule'
        run: uv run --frozen python -m tools.generics_plan --smoke --jobs 6 --timeout 45 --report generics-smoke-results.json
      - name: Run all mapped generics P0 oracles
        timeout-minutes: 15
        if: always() && github.event_name != 'schedule'
        run: uv run --frozen python -m tools.generics_plan --priority P0 --batch --report generics-plan-results.json
      - name: Run complete mapped generics inventory
        timeout-minutes: 30
        if: always() && github.event_name == 'schedule'
        run: uv run --frozen python -m tools.generics_plan --batch --report generics-plan-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generics-plan-results
          path: |
            generics-plan-results.json
            generics-smoke-results.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trait-plan-results
          path: trait-plan-results.json
          if-no-files-found: ignore
