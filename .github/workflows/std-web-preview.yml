name: std.web practical preview (Python 3.14)

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/valiance/std/web*'
      - 'src/valiance/std/html*'
      - 'src/valiance/std/_web_*'
      - 'samples/web/**'
      - 'tests/test_std_web*'
      - 'tests/test_std_html*'
      - 'tools/qualify_std_web_preview.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/std-web-preview.yml'
  pull_request:
    paths:
      - 'src/valiance/std/web*'
      - 'src/valiance/std/html*'
      - 'src/valiance/std/_web_*'
      - 'samples/web/**'
      - 'tests/test_std_web*'
      - 'tests/test_std_html*'
      - 'tools/qualify_std_web_preview.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/std-web-preview.yml'

jobs:
  preview-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install supported interpreter and project dependencies
        run: |
          uv python install 3.14
          uv sync --python 3.14 --locked
      - name: Verify package can be built
        run: uv build
      - name: Original-API practical H1/H2 acceptance (fail closed)
        run: |
          uv run --python 3.14 --with websockets --with wsproto \
            python tools/qualify_std_web_preview.py --api-matrix \
              --timeout-seconds 100 --output std-web-practical-api-ci-evidence.json
      - name: Publish machine-readable test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: std-web-practical-api-ci-evidence
          path: std-web-practical-api-ci-evidence.json
          if-no-files-found: warn
