[project]
name = "valiance"
version = "0.1.0"
description = "The Valiance Programming Language"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "isort>=8.0.1",
]

[project.scripts]
valiance = "valiance.main:main"
valiance-types = "valiance.type_explorer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valiance"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# enables fixes on save
fixable = ["ALL"]
